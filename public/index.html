<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7f4ef">
<meta name="description" content="Conversational Hungarian for the simplified naturalization interview — chunk drills, listening, dictation, and full mock interviews.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<title>Hungarian Lingo</title>
<link rel="stylesheet" href="style.css">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇭🇺</text></svg>">
</head>
<body>
<div id="app">
  <header id="topbar">
    <button id="back-btn" class="icon-btn hidden" aria-label="Back">‹</button>
    <div id="topbar-title">Hungarian Lingo</div>
    <div id="topbar-stats">
      <span class="chip" id="streak-chip" title="Day streak">🔥 <b>0</b></span>
      <span class="chip" id="xp-chip" title="Total XP">⭐ <b>0</b></span>
    </div>
  </header>

  <main id="main"></main>

  <nav id="tabbar">
    <button class="tab-btn active" data-view="learn"><span>📚</span>Learn</button>
    <button class="tab-btn" data-view="interview"><span>🎙️</span>Interview</button>
    <button class="tab-btn" data-view="review"><span>🔁</span>Review</button>
    <button class="tab-btn" data-view="me"><span>👤</span>Me</button>
  </nav>
</div>

<div id="toast" class="hidden"></div>

<script src="data.js"></script>
<script src="phonetics.js"></script>
<script src="speech.js"></script>
<script src="app.js"></script>
</body>
</html>
